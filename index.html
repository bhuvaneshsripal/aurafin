<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#247a4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurafin" />
    <meta name="description" content="Aurafin is a privacy-first net worth tracker for stocks, mutual funds, gold, crypto, cash, goals and more — built for Indian investors." />
    <title>Aurafin · Net Worth Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warms up the TLS/HTTP2 connections Firebase Auth + Firestore need on
         first load, so the very first request doesn't pay the full DNS +
         TCP + TLS handshake cost on top of the actual API round-trip. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <!-- Inter is the app's only typeface. It's loaded here (not via a CSS
         @import): Tailwind emits its layers first, which pushes an @import
         out of legal position, so the browser silently drops it. Weights
         400–700 only; the optical-size axis gives small UI text its own cut. -->
    <!-- Playfair Display: premium serif reserved for the "Aurafin" wordmark
         (via the .font-luxury utility / --font-luxury token), so the brand
         name reads as upscale next to the plain Inter UI around it. -->
    <!-- Non-blocking font load: the page paints immediately with the system
         font and swaps to Inter/Playfair when ready, so a slow Google Fonts
         response can never leave a blank screen. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" /></noscript>
    <style>
      html,body{background:#f7f7f5;margin:0}
      @media (prefers-color-scheme:dark){html.dark,html.dark body{background:#020617}}
      /* Instant first paint for returning users: shown from plain HTML before any JS loads,
         removed by the app once the real Overview is ready (src/utils/bootShell.ts). */
      #boot{display:none;position:fixed;inset:0;z-index:2147483000;background:#f7f5f0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a;
        padding-top:env(safe-area-inset-top,0px);overflow:hidden}
      html.boot-on #boot{display:block}
      html.dark #boot{background:#020617;color:#e2e8f0}
      #boot .bar{display:flex;align-items:center;gap:10px;padding:16px 18px;background:#fff;border-bottom:1px solid #e7e5e0}
      html.dark #boot .bar{background:#0b1220;border-color:#1e293b}
      #boot .brand{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:21px}
      #boot .dotc{width:30px;height:30px;border-radius:50%;background:#d9a520}
      #boot h1{font-size:24px;font-weight:600;margin:26px 18px 6px}
      #boot .ul{width:44px;height:3px;background:#247a4d;margin:0 18px 18px;border-radius:2px}
      #boot .card{background:#fff;border-radius:22px;margin:0 18px 14px;height:120px}
      html.dark #boot .card{background:#0f172a}
      #boot .row{display:flex;gap:14px;margin:0 18px 14px}
      #boot .row .card{margin:0;flex:1;height:78px}
      #boot .tall{height:230px}
    </style>
    <script>
      try{
        if(localStorage.getItem('aurafin-cached-user')&&location.pathname.replace(/\/+$/,'')===''){
          if(localStorage.getItem('aurafin-theme')==='dark')document.documentElement.classList.add('dark');
          document.documentElement.classList.add('boot-on');
          setTimeout(function(){document.documentElement.classList.remove('boot-on')},6000); /* safety net */
        }
      }catch(e){}
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="bar"><span class="dotc"></span><span class="brand">Aurafin.</span></div>
      <h1>Overview</h1><div class="ul"></div>
      <div class="card"></div>
      <div class="row"><div class="card"></div><div class="card"></div></div>
      <div class="card tall"></div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1.5rem;color:#475569">
        Aurafin needs JavaScript to run. Please enable JavaScript in your browser and reload this page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
